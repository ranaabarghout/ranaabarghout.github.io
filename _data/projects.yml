- name: "Do protein representations encode variant function? Diagnosing residue-level protein attributions via embedding-space gradients"
  descr: "Introduces IGLOO, a framework that scores residue-level attributions from protein language model fitness predictors against synthetic landscapes with known per-residue importance."
  date: 2026-10-22
  image: assets/img/publications/igloo.jpg
  paper: "https://www.biorxiv.org/content/10.64898/2026.10.21.760763v1"
  code: "https://github.com/chemcognition-lab/IGLOO"
  aftauthors: "S Wu, W Chau, JM Barraza-Chavez, P Driza, R Mahadevan, B Sanchez-Lengeling"
  tags:
    - tag: Protein Language Models
    - tag: Interpretability
    - tag: Protein Engineering
    - tag: Preprint

