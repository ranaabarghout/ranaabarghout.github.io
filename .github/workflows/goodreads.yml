name: Update Goodreads shelf

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/fetch-goodreads.js
        env:
          GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/goodreads.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/goodreads.json
            git commit -m "chore: update Goodreads shelf"
            git push
          fi
